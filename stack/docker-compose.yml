# One isolated stack per project (network, volumes, containers are all prefixed with the project name).
# Copied to projects/<proj>/docker-compose.yml by `setup.sh deploy`; variables come from the .env next to it.
name: mmrag-${PROJECT}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:-raganything}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DATABASE:-raganything}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # LightRAG + local patch (patches/pipeline.py is written against v1.5.2 — :latest does NOT start with it).
  rag-app:
    image: ${LIGHTRAG_IMAGE:-ghcr.io/hkuds/lightrag:v1.5.2}
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # served behind nginx at ${BASE_URL}${API_PREFIX}/ (nginx strips the prefix)
      LIGHTRAG_API_PREFIX: "${API_PREFIX}"
    volumes:
      - rag_inputs:/app/data/inputs
      - rag_storage:/app/data/rag_storage
      - ./prompts:/app/data/prompts
      - ../../patches/pipeline.py:/app/lightrag/pipeline.py:ro
    ports:
      - "127.0.0.1:${LIGHTRAG_PORT}:9621"
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "8"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9621/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  portal:
    build:
      context: ../..
      dockerfile: portal/Dockerfile
    environment:
      PROJECT_NAME: ${PROJECT}
      LIGHTRAG_URL: http://rag-app:9621
      LIGHTRAG_API_KEY: ${LIGHTRAG_API_KEY:-}
      LIGHT_RAG_URL: ${LIGHT_RAG_URL}
      PORTAL_BASE_PATH: ${MGMT_PREFIX}
    volumes:
      - portal_data:/data
    ports:
      - "127.0.0.1:${PORTAL_PORT}:8080"
    depends_on:
      - rag-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  rag_inputs:
  rag_storage:
  portal_data:

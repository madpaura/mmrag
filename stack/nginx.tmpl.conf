# mmrag project __PROJECT__ — generated by setup.sh, included from the host nginx `server {}` block:
#   include /etc/nginx/mmrag.d/*.conf;
# LightRAG API:   __BASE_URL____API_PREFIX__/      (prefix stripped; LightRAG runs with LIGHTRAG_API_PREFIX)
# Management UI:  __BASE_URL____MGMT_PREFIX__/     (prefix kept; the portal serves under PORTAL_BASE_PATH)
#
# Access: ONE key per project (LIGHTRAG_API_KEY in projects/__PROJECT__/.env).
#   scripts  -> header  X-API-Key: <key>                      (no password prompt)
#   browsers -> basic auth  user "__PROJECT__" / password <key>  (nginx then adds the key for LightRAG)
#   after either, nginx sets an HttpOnly session cookie (MMRAG_SESSION in .env, never shown to users) so the
#   browser's later requests pass too — needed because the LightRAG web UI sends its own Authorization header.
# Contains the key: keep this file readable by root/nginx only (setup.sh installs it 0640).

location = __API_PREFIX__ { return 301 __API_PREFIX__/; }

# LightRAG's Swagger page (also embedded in the web UI) hard-codes '/openapi.json' and '/static/swagger-ui/…',
# ignoring the API prefix — rewrite them.
location = __API_PREFIX__/docs {
    set $mmrag_realm "mmrag __PROJECT__";
    if ($http_x_api_key = "__API_KEY__") { set $mmrag_realm off; }
    if ($cookie___COOKIE__ = "__SESSION__") { set $mmrag_realm off; }
    auth_basic $mmrag_realm;
    auth_basic_user_file __HTPASSWD__;
    add_header Set-Cookie "__COOKIE__=__SESSION__; Path=__URL_ROOT__/__PROJECT__/; HttpOnly; SameSite=Strict";
    proxy_pass http://127.0.0.1:__LIGHTRAG_PORT__/docs;
    proxy_set_header X-API-Key "__API_KEY__";
    proxy_set_header Accept-Encoding "";
    sub_filter "url: '/openapi.json'" "url: '__API_PREFIX__/openapi.json'";
    sub_filter "/static/swagger-ui/" "__API_PREFIX__/static/swagger-ui/";   # CSS/JS/favicon also ignore the prefix
    sub_filter_once off;
}

location __API_PREFIX__/ {
    set $mmrag_realm "mmrag __PROJECT__";
    if ($http_x_api_key = "__API_KEY__") { set $mmrag_realm off; }
    if ($cookie___COOKIE__ = "__SESSION__") { set $mmrag_realm off; }
    auth_basic $mmrag_realm;
    auth_basic_user_file __HTPASSWD__;
    add_header Set-Cookie "__COOKIE__=__SESSION__; Path=__URL_ROOT__/__PROJECT__/; HttpOnly; SameSite=Strict";
    proxy_pass http://127.0.0.1:__LIGHTRAG_PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_set_header Authorization "";           # the browser's basic-auth header is not for LightRAG
    proxy_set_header X-API-Key "__API_KEY__";    # authenticated at nginx -> pass the project key on
    proxy_buffering off;               # streaming query responses
    proxy_read_timeout 3600s;
    client_max_body_size 512m;         # document uploads
}

location = __MGMT_PREFIX__ { return 301 __MGMT_PREFIX__/; }

# Package + sample downloads contain no secrets: keep them public so `pip install <url>` just works.
location __MGMT_PREFIX__/downloads/ {
    auth_basic off;
    proxy_pass http://127.0.0.1:__PORTAL_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __MGMT_PREFIX__/ {
    set $mmrag_realm "mmrag __PROJECT__";
    if ($http_x_api_key = "__API_KEY__") { set $mmrag_realm off; }
    if ($cookie___COOKIE__ = "__SESSION__") { set $mmrag_realm off; }
    auth_basic $mmrag_realm;
    auth_basic_user_file __HTPASSWD__;
    add_header Set-Cookie "__COOKIE__=__SESSION__; Path=__URL_ROOT__/__PROJECT__/; HttpOnly; SameSite=Strict";
    proxy_pass http://127.0.0.1:__PORTAL_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 600s;
    client_max_body_size 512m;
}

{%- from "_icons.html" import icon -%}
{%- if flash -%}
<div class="flash {{ flash_kind if flash_kind in ('ok','warn','bad') else '' }}" role="status" data-flash>
{{ icon({'ok':'ok','warn':'warn','bad':'bad'}.get(flash_kind, 'info'), {'ok':'ok','warn':'warn','bad':'bad'}.get(flash_kind, 'acc'), 'margin-top:2px') }}
<div style="flex:1;display:flex;flex-direction:column;gap:2px"><strong>{{ flash }}</strong></div>
<button class="ib" style="border:0;width:24px;height:24px" aria-label="Dismiss" onclick="this.closest('[data-flash]').remove()">{{ icon('x') }}</button>
</div>
{%- endif -%}
